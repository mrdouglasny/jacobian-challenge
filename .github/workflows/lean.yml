name: CI

on:
  push:
    branches: [main]
    # Skip the full build on doc-only pushes to main.
    # Pull requests always run CI (no paths filter there).
    # Triggers when any of these change:
    #   - Lean source or build config (need lake build)
    #   - scripts/ (axiom-report script, sorry/axiom checkers)
    #   - docs/axiom-report.txt (golden file — sync check must run)
    #   - this workflow file itself
    paths:
      - 'Jacobians/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/**'
      - 'docs/axiom-report.txt'
      - 'vendor/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          # Rolling key: unique per commit (`github.sha`) so every run SAVES its
          # `.lake/build`, and `restore-keys` warm-starts from the most recent prior
          # cache. The previous manifest-only key never refreshed (a key-hit doesn't
          # re-save), so the cached oleans were frozen and every run rebuilt the whole
          # foundational cone (~26 min). With this, incremental builds reuse recent
          # oleans and only changed modules + their downstream recompile.
          key: lake-${{ hashFiles('lake-manifest.json', 'lakefile.toml', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ hashFiles('lake-manifest.json', 'lakefile.toml', 'lean-toolchain') }}-
            lake-

      - name: lake update
        run: lake update

      - name: Fetch Mathlib oleans
        run: lake exe cache get || true

      - name: lake build
        run: lake build

      - name: Axiom report in sync with the kernel
        run: |
          set -euo pipefail
          lake env lean scripts/axiom_report.lean > axiom-report.regenerated.txt
          if ! diff -u docs/axiom-report.txt axiom-report.regenerated.txt; then
            echo "::error::docs/axiom-report.txt is out of sync with the kernel #print axioms output."
            echo "::error::Regenerate and commit:  lake env lean scripts/axiom_report.lean > docs/axiom-report.txt"
            {
              echo "### ❌ Stale axiom report"
              echo "\`docs/axiom-report.txt\` (cited by AXIOM_AUDIT.md / README as the machine-checked dependency record) differs from a fresh regeneration. Run:"
              echo '```'
              echo "lake env lean scripts/axiom_report.lean > docs/axiom-report.txt"
              echo '```'
              echo "and commit the result."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✓ Axiom report matches the kernel" >> "$GITHUB_STEP_SUMMARY"

      - name: Sorries confined to known scaffolds (core stays sorry-free)
        if: always()
        run: |
          set -uo pipefail
          # Files permitted to contain `sorry`, in two categories, all OUTSIDE the
          # core challenge. The invariant this guards: no `sorry` escapes into the
          # core (Challenge API, Jacobian construction, curve witnesses, S1–S7 framework).
          # Counts within these files may fluctuate freely.
          #   (a) extension/bridge scaffolds — gap-layer holes;
          #   (b) anchor-layer files — intentionally deferred proofs of Gemini-vetted
          #       RR/Serre/Plücker statements (the value is the locked-down statement;
          #       see README "Anchor APIs").
          allow="Jacobians/Extensions/HyperellipticOdd.lean
          Jacobians/Extensions/AbelJacobi.lean
          Jacobians/Bridge/KirovLineIntegral.lean
          Jacobians/ProjectiveCurve/Hyperelliptic/AntiInvariance.lean
          Jacobians/RiemannSurface/Cohomology/RiemannRochAPI.lean
          Jacobians/RiemannSurface/Cohomology/SerreDualityAPI.lean
          Jacobians/RiemannSurface/Cohomology/RiemannRochAnchor.lean"
          allow_clean="$(echo "$allow" | sed 's/^[[:space:]]*//')"
          fail=0
          echo "### Sorry guard (file-level: core must stay sorry-free)" >> "$GITHUB_STEP_SUMMARY"
          # File-level only — exact on *which* files carry a sorry. The robust
          # file list (Lean comments stripped, broad `\bsorry\b` so term-mode
          # `exact sorry`/`refine sorry`/`simpa using sorry` are caught, prose and
          # `sorryAx` are not) comes from scripts/check_sorry_consistency.sh.
          # Per-declaration counts live in the README; the informational step
          # below verifies the total against the real count.
          # Capture the list first so a detector failure FAILS the gate (a process
          # substitution would yield empty and let the gate pass silently).
          if ! sorry_list="$(bash scripts/check_sorry_consistency.sh --list-files)"; then
            echo "::error::sorry detector (scripts/check_sorry_consistency.sh) failed to run"
            exit 1
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if grep -qxF "$f" <<< "$allow_clean"; then
              echo "- \`$f\` — allowed scaffold" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error file=$f::sorry found outside the allowed scaffolds — the core must stay sorry-free. If this is a legitimate new scaffold, add it to the allowlist in .github/workflows/lean.yml."
              echo "- ❌ \`$f\` — NOT allowed (sorry escaped the scaffolds)" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done < <(printf '%s\n' "$sorry_list" | sort)
          [ "$fail" -eq 0 ] && echo "✓ every \`sorry\`-bearing file is an allowlisted scaffold; core is sorry-free." >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Sorry count (informational — maintainer reconciles at merge)
        if: always()
        run: |
          # Non-blocking companion to the file-level guard above, which proves the
          # core is sorry-free but (by its own note) asserts no total. This prints
          # the kernel-style REAL sorry count (Lean comments — incl. docstring
          # `:= by sorry` examples — stripped, so prose doesn't inflate it) and
          # flags any drift vs the README "At a glance" total to the run summary,
          # so the maintainer reconciles at merge. Never fails the build.
          bash scripts/check_sorry_consistency.sh >> "$GITHUB_STEP_SUMMARY" 2>&1 || \
            echo "::notice::sorry-count docs differ from the real count — informational only; reconciled by the maintainer at merge."

      - name: Axiom count (informational — maintainer reconciles at merge)
        if: always()
        run: |
          # Non-blocking: prints the kernel axiom count + any doc drift to the run
          # summary so the maintainer can reconcile counts at merge. Contributors do
          # NOT need to update axiom counts; this never fails the build. (The
          # soundness-relevant gate is "Axiom report in sync with the kernel" above.)
          bash scripts/check_axiom_consistency.sh >> "$GITHUB_STEP_SUMMARY" 2>&1 || \
            echo "::notice::axiom-count docs differ from the kernel — informational only; counts are reconciled by the maintainer at merge."
