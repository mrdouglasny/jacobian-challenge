# formalization.yaml (v0.3)
# https://github.com/mathlib-initiative/formalization.yaml
# jacobian-challenge — current state 2026-06-12

version: "v0.3"

project:
  name: "Jacobians of Compact Riemann Surfaces"
  authors:
    - "Michael R. Douglas"
    - "daouid (community contributor)"
    - "sqrt-of-2 (community contributor)"
    - "Jack McCarthy / Deicyde (community contributor)"
    # Code is AI-authored throughout; see automation section.
  license: "Apache-2.0"

sources:
  - title: "Kevin Buzzard's Jacobian Challenge (v0.4)"
    authors: ["Kevin Buzzard"]
    id: "https://gist.github.com/kbuzzard/778bc714030b3e974ab5f4038783d1a9"
    type: "challenge spec"
    license: "Apache-2.0"
    author_contacted: "no"
    prior_work: ""

  - title: "jacobian-claude (Kirov's completed Jacobian formalization)"
    authors: ["Rado Kirov"]
    id: "https://github.com/rkirov/jacobian-claude"
    type: "formalization"
    license: "Apache-2.0"
    author_contacted: "yes"
    prior_work: ""
    # This project uses Kirov's Dolbeault/RR/Serre machinery as a compiled
    # require dependency (~86k LOC, vendor/kirov-dolbeault-port/). Mathematical
    # content is Kirov's; forward-port to our Mathlib version required 6 edits.
    # Our Abel engine (~32k LOC in AbelSubset* / InteriorEngine / SlitLog /
    # SegmentPeriod) is built on top of his infrastructure.

  - title: "Lectures on Riemann Surfaces"
    authors: ["Otto Forster"]
    id: "Springer GTM 81, ISBN 978-1-4612-9937-2"
    type: "textbook"
    # Abel's theorem §§20–21, period lattice discreteness §21.4.

  - title: "Principles of Algebraic Geometry"
    authors: ["Phillip Griffiths", "Joseph Harris"]
    id: "Wiley Classics Library, ISBN 0-471-05059-8"
    type: "textbook"
    # Riemann bilinear relations Ch. 2 §2, Hodge theory.

  - title: "Algebraic Curves and Riemann Surfaces"
    authors: ["Rick Miranda"]
    id: "AMS Graduate Studies in Mathematics Vol. 5, ISBN 0-8218-0268-2"
    type: "textbook"
    # Frame-trace / canonical-divisor construction §VIII.3.

  - title: "Tata Lectures on Theta I"
    authors: ["David Mumford"]
    id: "Birkhäuser, ISBN 0-8176-3109-7"
    type: "textbook"
    # Period lattice / Jacobian / Abel theory §III.3.

  - title: "Jacobian Varieties (course notes)"
    authors: ["J. S. Milne"]
    id: "https://www.jmilne.org/math/xnotes/JVs.pdf"
    type: "lecture-notes"
    # Albanese universal property of the Jacobian.

status:
  scope: >
    Formalize all 24 obligations of Buzzard's Jacobian Challenge v0.4:
    construct the Jacobian of an arbitrary compact Riemann surface as a complex
    torus, define the Abel–Jacobi map and pushforward/pullback functoriality, and
    prove the key anti-degeneracy properties (correct genus via Liouville,
    genus_eq_zero_iff_homeo, injective Abel–Jacobi in positive genus,
    pullback-pushforward = degree). Additional scope beyond the challenge:
    Riemann–Roch and Serre duality (standard-3 theorems over the Kirov Dolbeault
    port), the Albanese universal property (proved modulo 3 torus axioms), and
    concrete positive-genus curve instances (elliptic, hyperelliptic, plane curve).

  sorry_count: 0
  # 0 in the Buzzard-critical path and core modules.
  # 11 in out-of-scope extensions (adelic H¹ construction — not on the critical path).
  sorry_in_definitions: 0

  axioms:
    # Standard Lean 4 axioms shared by all Lean/Mathlib projects:
    - propext
    - Classical.choice
    - Quot.sound
    # Project axioms (10 active as of 2026-06-12, kernel-verified, AXIOM_AUDIT.md):
    #
    # CHALLENGE-CRITICAL (appears in Buzzard headline kernel traces):
    - Axioms.AX_PeriodCycleBasis
    #   Every compact connected Riemann surface has 2g analytic loops forming a ℤ-basis
    #   of H₁(X,ℤ) satisfying the Riemann bilinear relations arc-level (R1 isotropy,
    #   R2 Hodge positivity). Griffiths–Harris Ch. 2 §2; Forster §§19–21.
    #   Discharge: boundary-word engines proved (BilinearRelationsBoundaryWord*.lean);
    #   open: slit-sheet/4g-gon construction and H₁ rank-2g count.
    #   Elliptic (g=1) witness proved unconditionally (Elliptic/H1Basis.lean, 2026-06-12).
    #
    # NON-CHALLENGE-CRITICAL (not required by any Buzzard declaration):
    - Axioms.AX_torus_self_albanese        # Albanese universal property only
    - Axioms.AX_period_functoriality       # Albanese universal property only
    - Axioms.AX_curve_generates_jacobian   # Albanese universal property only
    - Axioms.AX_IntersectionForm_alternating  # topological anchoring, no Buzzard consumers
    - Axioms.AX_IntersectionForm_perfect      # topological anchoring, no Buzzard consumers
    - ProjectiveCurve.PlaneCurveAffine.AX_PlaneCurveAffine_connected  # plane curve witness
    - Axioms.AX_PluckerFormula             # plane curve genus formula
    - Axioms.AX_Elliptic_H1_symplectic    # elliptic H₁ symplectic form (being discharged)
    - Axioms.AX_Hyperelliptic_genus        # hyperelliptic genus witness

  main_results:
    - declaration: "genus_eq_zero_iff_homeo"
      file: "Jacobians/Challenge.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "jacobian-challenge-comparator-run/config-buzzard.json"
      literature_dependencies: []

    - declaration: "Jacobian.ofCurve_inj"
      file: "Jacobians/Challenge.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound, Axioms.AX_PeriodCycleBasis]
      comparator_config: "jacobian-challenge-comparator-run/config-buzzard.json"
      literature_dependencies:
        - statement: >
            Every compact connected Riemann surface of genus g admits 2g piecewise-real-analytic
            loops forming a ℤ-basis of H₁(X,ℤ) whose arc period vectors satisfy the
            Riemann bilinear relations.
          source: "Griffiths–Harris Ch. 2 §2; Forster §§19–21"

    - declaration: "Jacobian.pushforward_pullback"
      file: "Jacobians/Challenge.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound, Axioms.AX_PeriodCycleBasis]
      comparator_config: "jacobian-challenge-comparator-run/config-buzzard.json"
      literature_dependencies:
        - statement: "Same as ofCurve_inj above."
          source: "Griffiths–Harris Ch. 2 §2; Forster §§19–21"

    - declaration: "Layer3.riemannRochL3"
      file: "Jacobians/Layer3/Cohomology.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "jacobian-challenge-comparator-run/config.json"
      # Verified by Lean FRO comparator at commit 67af290 (see COMPARATOR.md).
      literature_dependencies: []

    - declaration: "Jacobians.ProjectiveCurve.genus_projectiveLine_eq_zero"
      file: "Jacobians/ProjectiveCurve/Line/Genus.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      literature_dependencies: []

    - declaration: "Jacobians.ProjectiveCurve.genus_Elliptic_eq_one"
      file: "Jacobians/ProjectiveCurve/Elliptic/OneForm.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      literature_dependencies: []

    - declaration: "Jacobians.Extensions.HyperellipticEven.genus_HyperellipticEven_eq"
      file: "Jacobians/Extensions/HyperellipticEven.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      literature_dependencies: []

    - declaration: "Jacobians.Extensions.ofCurve_isJacobian"
      file: "Jacobians/Extensions.lean"
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
        - Axioms.AX_PeriodCycleBasis
        - Axioms.AX_torus_self_albanese
        - Axioms.AX_period_functoriality
        - Axioms.AX_curve_generates_jacobian
      literature_dependencies:
        - statement: "The Jacobian is the Albanese variety of the curve."
          source: "https://www.jmilne.org/math/xnotes/JVs.pdf"

automation:
  methods:
    - method: "agent"
      models:
        - "claude-fable-5 (primary)"
        - "claude-opus-4-8"
        - "claude-sonnet-4-6"
      framework: "Claude Code (Anthropic CLI)"
      tool_setup: >
        Claude Code with lean-lsp-mcp (LSP diagnostics), lean4-subagents plugin
        (proof repair / sorry-filling subagents), Gemini MCP (deep-think axiom
        vetting), Codex companion (rescue passes). Custom hooks for pre-push Lean
        verification (lake env lean per file). Multi-agent orchestration: parallel
        branches worked by separate agent accounts (primary + up to 4 concurrent),
        coordinated via GitHub PRs. All PRs carry Co-Authored-By trailers
        identifying the AI model used.
      cost:
        wall_time: "~8 weeks (2026-04-19 to 2026-06-12); 22 active commit-days"
        spend_usd: "subscription-based; no per-token billing tracked"
        hardware: "API-only (Anthropic endpoints)"
      prompting_notes: >
        Backward-chaining scaffold: all 24 Buzzard obligations closed on day 5
        via typed axiom stubs, then a sustained discharge campaign reducing the
        axiom count from a peak of 103 declarations to 10. Each mathematical
        wall (Abel, RR/Serre, bilinear relations, genus-0 uniformization) was
        scoped as a named problem before implementation. The challenge spec is
        treated as an externally-pinned, CI-diffed invariant — never weakened.

    - method: "agent"
      models: ["codex / GPT-5.4"]
      framework: "OpenAI Codex CLI (shared runtime)"
      tool_setup: "codex-companion plugin for Claude Code"
      cost:
        spend_usd: "subscription-based"
      prompting_notes: >
        Rescue passes on stuck proofs, deep root-cause investigation, independent
        review of proof strategies and axiom formulations.

    - method: "other"
      models: ["gemini-3-pro-preview", "gemini-3.1-pro"]
      framework: "Gemini MCP (deep-think)"
      prompting_notes: >
        Cross-vetting only, not a prover: every project axiom vetted for type
        correctness, strength, non-vacuity, and satisfiability before use.
        Results recorded in AXIOM_AUDIT.md per-axiom. Also used for second
        opinions on mathematical arguments and definition design.

  spend_usd: "subscription-based across all methods"
  notes: >
    Multi-agent community project. Michael R Douglas (human) steers strategy and
    approves PRs; code is produced by AI agents under his supervision. Community
    contributors (daouid, sqrt-of-2, Deicyde) ran their own agent sessions and
    submitted PRs independently. The project reached 465 commits and 233+ merged
    PRs over 8 weeks. No human-written Lean; all proofs AI-authored.

    The Kirov Dolbeault port (vendor/kirov-dolbeault-port/, ~86k LOC, Apache 2.0)
    is a compiled require dependency providing the analytical engine (Dolbeault
    theory, Riemann–Roch, Serre duality, Abel machinery). The mathematical content
    is Kirov's; our forward-port to our Mathlib version required 6 edits across 5
    files. Our extensions to the port (~32k LOC: AbelSubset*, InteriorEngine,
    SlitLogIntegral, SegmentPeriod) constitute original work. Verbatim vendored
    modules from Kirov (Apache 2.0, Jacobians/Vendor/Kirov/, 5,806 LOC) and
    tangentstorm/Wallace (MIT, Jacobians/Vendor/Wallace/, 2,917 LOC) carry
    per-file attribution headers.

fidelity:
  divergences: >
    1. One remaining literature dependency. AX_PeriodCycleBasis — the existence of
    a canonical homology basis satisfying the Riemann bilinear relations — is the
    single remaining unproved classical input for the Buzzard-facing declarations.
    All other inputs to the 24 obligations are proved or discharged. Discharge is
    in progress: the boundary-word R1/R2 engines are proved; the open piece is
    the slit-sheet/4g-gon construction of loops and the H₁ rank-2g count.

    2. Period lattice representation. We index the lattice via H₁(X,ℤ) =
    Abelianization(π₁(X)) with the period map built from arc integrals over
    explicit analytic loops. Kirov uses the ℤ-span of periods of all closed smooth
    loops (truePeriodLattice). A linear equivalence between the two representations
    is proved (Bridge/KirovDolbeaultPeriods.lean).

    3. Holomorphic 1-forms. Represented as a chart-local coefficient submodule
    (coeff : X → ℂ → ℂ with cocycle condition) rather than ContMDiffSection of
    the cotangent bundle. A linear equivalence to Kirov's representation is proved
    (Bridge/KirovHolomorphicEquiv.lean). The chart-local form supports explicit
    arc integration more directly.

    4. Abel's theorem. Proved via the Forster §20 ∂̄-engine (§20 weak solutions for
    ⊆, discharged 2026-06-12) and the Liouville/Jacobi-pencil route (⊇, discharged
    2026-06-12). Both directions are now standard-3 + AX_PeriodCycleBasis.

    5. Scope beyond the challenge. Riemann–Roch and Serre duality are proved as
    standard-3 theorems (riemannRochL3, serreDualityL3; comparator-verified). The
    Albanese universal property (ofCurve_isJacobian) is proved modulo 3 torus
    axioms (not Buzzard requirements). Positive-genus curve instances (elliptic,
    hyperelliptic, plane curve) give axiom-free genus computations; the elliptic
    PeriodCycleBasis witness (g=1) is the first unconditional positive-genus
    instantiation of the remaining axiom's content.

review:
  status: "agent-reviewed"
  reviewers:
    - "Gemini 3 Pro / 3.1 Pro (deep-think): axiom vetting for every project axiom"
    - "Codex / GPT-5.4: independent proof strategy review on selected results"
  notes: >
    No human mathematician has independently reviewed the Lean source. The README
    carries a prominent caveat to this effect. The Lean kernel (via CI diff of
    docs/axiom-report.txt) provides the primary soundness guarantee; social
    provenance is weaker than Mathlib's. The Lean FRO comparator was run on
    riemannRochL3 at commit 67af290 (recorded in COMPARATOR.md). A full
    24-obligation comparator run is prepared (jacobian-challenge-comparator-run/
    config-buzzard.json) and will execute when AX_PeriodCycleBasis is discharged.

