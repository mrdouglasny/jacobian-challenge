name = "Jacobians"
version = "0.1.0"
keywords = ["math", "riemann-surfaces", "jacobians"]
defaultTargets = ["Jacobians"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The Mathlib-standard header linter (stricter as of Lean/Mathlib v4.30.0)
# rejects this project's intentional non-standard headers (e.g. the
# "compiles with commit …" note, changelog docstrings). We are not Mathlib;
# disable just that style linter while keeping the rest of the standard set.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"  # v4.30.0

[[lean_lib]]
name = "Jacobians"
