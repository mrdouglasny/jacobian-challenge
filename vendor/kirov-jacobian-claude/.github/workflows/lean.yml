name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sorry count (informational)
        run: python3 scripts/check_sorries.py  # informational; not a gate

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Axiom hygiene check
        run: lake env lean AxiomCheck.lean
